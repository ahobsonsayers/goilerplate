# Docs: https://taskfile.dev/#/usage
version: "3"

tasks:
  format:
    cmds:
      - go tool gofumpt -l -w .

  lint:
    cmds:
      - go tool golangci-lint run --fix ./...

  generate:
    aliases:
      - gen
    cmds:
      - go tool oapi-codegen -config oapi.config.yaml schema/openapi.yaml

  test:
    cmds:
      - go test ./...

  test:clean:
    cmds:
      - go clean -testcache
      - task: test

  build:
    deps: [build:fe]
    cmds:
      - go build -v -o ./bin/goilerplate ./cmd/goilerplate

  build:docker:
    cmds:
      - docker build . --tag goilerplate

  build:fe:
    dir: frontend
    cmds:
      - bun install --frozen-lockfile
      - bun run build

  check:fe:
    dir: frontend
    cmds:
      - bun install --frozen-lockfile
      - bun run check

  dev:fe:
    dir: frontend
    cmds:
      - bun install --frozen-lockfile
      - bun run dev

  run:
    cmds:
      - go run ./cmd/goilerplate {{.CLI_ARGS}}

  run:docker:
    deps: [build:docker]
    cmds:
      - |
        docker run --rm \
          --name goilerplate \
          -p 8080:8080 \
          goilerplate serve --port 8080
