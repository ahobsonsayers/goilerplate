name: Build and Push

on:
  # Manual Invocation
  workflow_dispatch:
    inputs:
      tags:
        description: Docker Image Tag(s)
        type: string
        default: develop

  # Workflow Invocation
  workflow_call:
    inputs:
      tags:
        description: Docker Image Tag(s)
        type: string
        required: true

jobs:
  get-tags:
    name: Get tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      tags: ${{ steps.get-tags.outputs.tags }}

    steps:
      - name: Get tags
        id: get-tags
        run: |
          {
            echo "tags<<EOF"
            echo "$INPUT_TAGS" | tr ',' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAGS: ${{ inputs.tags }}

  build-push:
    name: Build and Push
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-build-push.yaml@main
    needs: [get-tags]
    secrets: inherit
    with:
      image-name: arranhs/goilerplate
      image-tags: ${{ needs.get-tags.outputs.tags }}
